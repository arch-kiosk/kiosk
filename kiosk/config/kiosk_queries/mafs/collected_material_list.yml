header:
  version: 1
meta:
  query_type: StructuredKioskQuery
  category: "Finds"
variables:
  a_unit: ["dsd('unit', 'arch_context')", "input_default(null)"]
  b_from_date: [datatype(date), label("after"), "input_default(null)"]
  c_to_date: [datatype(date), label("before"), "input_default(null)"]

queries:
  'mafs_collected_material_lot':
    name: 'MAFS: List materials'
    description: 'MAFS: Lists materials found across all sites or per trench.'
    type: 'SQL'
    output_type: 'list'
    query: "  
      select
            cm.arch_context cm_id,
            u.arch_context trench,
            l.arch_context op,
            lot.id lot_id,
            cm.cm_type,
            cm.type material,
            cm.description,
            cm.quantity,
            cm.weight,
            cm.volume,
            cm.dearregistrar
       from {{unit}} u
         inner join {{locus}} l on u.uid = l.uid_unit
         inner join {{collected_material}} cm on l.uid = cm.uid_locus
         left outer join {{lot}} lot on cm.uid_lot = lot.uid
      where
        ({{#a_unit}} is null or u.arch_context={{#a_unit}}) and   
        ({{#b_from_date}} is null or {{#c_to_date}} is null or coalesce(cm.date, cm.created) between {{#b_from_date}} and {{#c_to_date}}) 
      group by 
            u.arch_context,
            l.arch_context,
            lot.id,
            cm.arch_context,
            cm.cm_type,
            cm.type,
            cm.description,
            cm.quantity,
            cm.weight,
            cm.volume,
            cm.dearregistrar
      order by cm_id;
      "
    column_information:
      trench: DSD('unit','arch_context')
      op: DSD('locus','arch_context')
      lot_id: ["DSD('lot','id')","label('lot')"]
      cm_id: DSD('collected_material','arch_context')
      cm_type: DSD('collected_material','cm_type')
      material: DSD('collected_material','type')
      description: DSD('collected_material','description')
      quantity: DSD('collected_material','quantity')
      weight: DSD('collected_material','weight')
      volume: DSD('collected_material','volume')
      dearregistrar: DSD('collected_material','dearregistrar')
